channel: ai-infra
title: AI Infra 每周资讯
title_en: AI Infra Weekly
description: AI 基础设施全栈每周资讯 —— 芯片 / 编译器 / 推理 / 数据中心 / 安全 / 自动算子 / 端侧
# ── 源 + 关键词统一从 _engine/news_config.json 读取（与日报共用，单一事实源）──
# 本 yaml 只保留：领域显示结构（id/emoji/name/desc）、频道去重、龙头股清单。
# 关键词 / rss_feeds / cn_rss_feeds 均在共享配置里。
# 下面两个字段仅供 manifest 展示（与共享配置一致，别改）：实际抓取用共享配置。
arxiv_categories: [cs.DC, cs.AR, cs.PL, cs.LG, cs.RO]
hn_min_score: 60
domains:
  - id: chips
    emoji: "1️⃣"
    name: AI 芯片
    desc: Nvidia / AMD / Intel / 自研芯片 / HBM / 制程 / TSMC / Samsung / SK Hynix
  - id: compilers
    emoji: "2️⃣"
    name: AI 编译器与框架
    desc: tinygrad / MLIR / TVM / XLA / Triton / torch.compile / JAX / Mojo
  - id: inference-dc
    emoji: "3️⃣"
    name: AI 推理优化（数据中心）
    desc: 量化 / 稀疏化 / KV Cache / Speculative Decoding / MoE / vLLM / TensorRT-LLM / SGLang（面向 H100/B200 集群）
  - id: datacenter
    emoji: "4️⃣"
    name: 数据中心与基础设施
    desc: 液冷 / 机架 / 网络(InfiniBand/RoCE) / 存储 / 电力 / 集群 / 超大规模 capex
  - id: safety
    emoji: "5️⃣"
    name: AI 安全与治理
    desc: 对齐 / 红队 / 可解释性 / 开源许可 / 出口管制 / 各国政策法规
  - id: embodied-infra
    emoji: "6️⃣"
    name: 具身智能（基础设施视角）
    desc: 机器人算力 / 边缘 NPU / 真机部署的推理系统（仅基础设施视角，纯算法与产业动态见 Embodied AI 频道）
  - id: autokernel
    emoji: "7️⃣"
    name: AI 自动算子与代码生成优化
    desc: AlphaEvolve / FunSearch / AI Kernel 生成 / LLM-driven compiler / 自动调优 / LLM RTL 生成
  - id: edge
    emoji: "8️⃣"
    name: 边缘与端侧推理
    desc: 手机/PC/嵌入式 LLM/VLM 推理 - llama.cpp / MLC-LLM / ExecuTorch / MLX / NPU / 小模型 / 极低比特量化

# 去重：命中以下关键词的条目划归 Embodied AI 频道，不收入本频道（除非同时强命中基础设施词）
exclude_to_channel:
  embodied-ai: [vla, "vision-language-action", openvla, "pi0", "pi-zero", "diffusion policy", "dexterous", "sim2real", "teleoperation", "world model", "humanoid policy", "manipulation policy"]

