  - {name: "TechCrunch Fundraising", kind: finance, url: "https://techcrunch.com/tag/fundraising/feed/"}
  - {name: "TechCrunch Venture", kind: finance, url: "https://techcrunch.com/category/venture/feed/"}
  - {name: "Crunchbase News", kind: finance, url: "https://news.crunchbase.com/feed/"}
  - {name: "VentureBeat AI", kind: media, url: "https://venturebeat.com/category/ai/feed/"}
  - {name: "The Verge AI", kind: media, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"}
  - {name: "Import AI", kind: analysis, url: "https://importai.substack.com/feed"}

