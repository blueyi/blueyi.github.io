<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Yulong Wang — personal homepage. Notes, code, and contact." />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Yulong · yulong.wang</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0a0a0f;
            --bg-soft: #11111a;
            --fg: #e8e8ee;
            --fg-dim: #9a9aa8;
            --fg-mute: #5a5a6a;
            --accent: #7c5cff;
            --accent-2: #22d3ee;
            --accent-3: #f472b6;
            --border: rgba(255, 255, 255, 0.08);
            --card: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-feature-settings: 'ss01', 'cv11';
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* Aurora gradient background */
        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            background:
                radial-gradient(40% 35% at 20% 25%, rgba(124, 92, 255, 0.35), transparent 60%),
                radial-gradient(35% 30% at 80% 20%, rgba(34, 211, 238, 0.25), transparent 60%),
                radial-gradient(45% 40% at 60% 90%, rgba(244, 114, 182, 0.20), transparent 60%);
            filter: blur(40px);
            z-index: -2;
            animation: drift 22s ease-in-out infinite alternate;
        }
        @keyframes drift {
            0%   { transform: translate3d(0,0,0) scale(1); }
            100% { transform: translate3d(2%, -1%, 0) scale(1.05); }
        }

        /* Subtle grid overlay */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            z-index: -1;
            pointer-events: none;
        }

        .page {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            padding: 32px clamp(20px, 5vw, 64px);
        }

        /* Top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 13px;
            color: var(--fg-dim);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.02em;
        }
        .brand .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 12px var(--accent-2);
            animation: pulse 2.4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.6; transform: scale(0.85); }
        }
        .status { color: var(--fg-mute); }
        .status .live { color: #4ade80; }

        /* Hero */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 920px;
            width: 100%;
            margin: 0 auto;
            padding: 64px 0;
        }
        .eyebrow {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 13px;
            color: var(--accent-2);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(8px);
            animation: rise 0.7s ease-out 0.1s forwards;
        }
        h1 {
            font-size: clamp(56px, 11vw, 144px);
            line-height: 0.95;
            letter-spacing: -0.04em;
            font-weight: 700;
            margin-top: 18px;
            background: linear-gradient(135deg, #ffffff 20%, #b5a8ff 55%, #7dd3fc 95%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0;
            transform: translateY(20px);
            animation: rise 0.9s cubic-bezier(.2,.7,.2,1) 0.2s forwards;
        }
        h1 .cursor {
            display: inline-block;
            width: 0.08em;
            height: 0.85em;
            background: var(--accent);
            vertical-align: -0.05em;
            margin-left: 0.05em;
            animation: blink 1.1s steps(1) infinite;
            border-radius: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .tagline {
            margin-top: 22px;
            max-width: 620px;
            font-size: clamp(16px, 1.6vw, 18px);
            color: var(--fg-dim);
            line-height: 1.6;
            opacity: 0;
            transform: translateY(12px);
            animation: rise 0.8s ease-out 0.45s forwards;
        }
        .tagline .accent { color: var(--fg); }

        @keyframes rise {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Link grid */
        .links {
            margin-top: 56px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }
        .link {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--fg);
            text-decoration: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
            opacity: 0;
            transform: translateY(14px);
            animation: rise 0.7s ease-out forwards;
            overflow: hidden;
        }
        .link:nth-child(1) { animation-delay: 0.6s; }
        .link:nth-child(2) { animation-delay: 0.7s; }
        .link:nth-child(3) { animation-delay: 0.8s; }
        .link:nth-child(4) { animation-delay: 0.9s; }
        .link:nth-child(5) { animation-delay: 1.0s; }

        .link::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }
        .link:hover {
            transform: translateY(-2px);
            background: var(--card-hover);
            border-color: transparent;
        }
        .link:hover::after { opacity: 1; }

        .link .icon {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            color: var(--fg);
            flex-shrink: 0;
        }
        .link .icon svg { width: 18px; height: 18px; }
        .link .meta { display: flex; flex-direction: column; min-width: 0; }
        .link .label {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }
        .link .sub {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            color: var(--fg-mute);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .link .arrow {
            margin-left: auto;
            color: var(--fg-mute);
            transition: transform 0.25s ease, color 0.25s ease;
            flex-shrink: 0;
        }
        .link:hover .arrow {
            color: var(--fg);
            transform: translate(2px, -2px);
        }

        /* Footer */
        footer {
            margin-top: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--fg-mute);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            opacity: 0;
            animation: rise 0.8s ease-out 1.2s forwards;
        }
        footer .loc { display: flex; align-items: center; gap: 8px; }
        footer .loc svg { width: 12px; height: 12px; }

        @media (max-width: 520px) {
            .page { padding: 24px 20px; }
            main { padding: 40px 0; }
            .tagline { margin-top: 18px; }
            .links { margin-top: 40px; }
            footer { flex-direction: column; gap: 10px; align-items: flex-start; margin-top: 40px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .eyebrow, h1, .tagline, .link, footer { opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
